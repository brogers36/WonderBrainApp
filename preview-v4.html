<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WonderBrain v4 Preview</title><style>:root{font-family:system-ui;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101728;color:#f6f4ff}main{max-width:1000px;margin:auto;padding:18px}header{background:linear-gradient(120deg,#293c70,#684a84);padding:24px;border-radius:18px}h1{margin:5px 0}p{line-height:1.7}nav,.actions{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0}button,input{font:inherit}button{cursor:pointer;background:#252f49;color:white;border:1px solid #52607e;border-radius:12px;padding:12px;text-align:left}button:focus-visible,input:focus-visible{outline:3px solid #f6d484}button:hover{border-color:#d0a8fa}.active,.primary{background:#7553bf}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:12px}.tile,.panel{background:#1b253b;border:1px solid #38435e;border-radius:16px;padding:18px}.tile{min-height:115px}.tile strong,.tile small{display:block;margin-top:8px}.tile small,.muted{color:#c0c8dc}.emoji{font-size:26px}.crumb{color:#c0c8dc;font-size:13px;margin:15px 0}.depth{display:inline-block;background:#44366b;padding:7px 12px;border-radius:30px}.panel{margin:12px 0}.panel h2{line-height:1.3}input{width:100%;padding:12px;border:1px solid #65708b;border-radius:10px;background:#111a2c;color:white}.bar{height:7px;background:#39405b;border-radius:10px;margin:15px 0}.bar span{display:block;background:#bd9df4;height:100%;border-radius:10px}.answer{font-size:18px;line-height:1.8}.notice{padding:14px;border-left:4px solid #ba99ec;background:#29324d;border-radius:8px;margin-top:18px}.gamebtn{display:block;width:100%;margin:10px 0}.correct{background:#1c5c48}.wrong{background:#793e4d}@media(max-width:420px){header{padding:18px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.tile{padding:12px}}</style></head><body><main><header><div>✦ THE CURIOSITY LAB</div><h1>WonderBrain v4 · Preview</h1><p>Follow a question. Go deeper. Explore freely, without streaks or pressure.</p></header><nav id="nav"></nav><section id="app"></section></main><script>const topics=[["🌌","Astronomy","Stars and spectra","Why do stars have different colors?","A star's color is closely related to surface temperature: blue stars are generally hotter than red stars.","How do we know?","Astronomers analyze the light spectrum and absorption lines to estimate temperatures and composition."],["🕳️","Astrophysics","Black holes","Why can black holes bend light?","Mass curves spacetime, and light follows paths in that geometry.","What is an event horizon?","It is the boundary beyond which outward-traveling light cannot escape to distant observers."],["🧬","Biology","Evolution","Does evolution have a goal?","No. Evolution reflects mutation, selection, genetic drift and gene flow rather than a predetermined destination.","Why does environment matter?","A useful trait in one environment may be harmful in another."],["🔬","Cell Biology","Mitochondria","How do mitochondria make ATP?","Electron transport establishes a proton gradient across the inner mitochondrial membrane.","What uses that gradient?","ATP synthase harnesses proton movement to help produce ATP."],["🛡️","Immune Biology","Immune memory","How does immune memory work?","Some B and T cells persist after an immune response and respond more quickly upon re-exposure.","How do vaccines use this?","Vaccines train immune recognition without requiring the corresponding natural infection."],["⚛️","Quantum Physics","Tunneling","What is quantum tunneling?","Quantum systems can have a nonzero chance of crossing barriers forbidden by classical mechanics.","Where is it useful?","Scanning tunneling microscopes use tunneling current to examine surfaces."],["🧪","Chemistry","Dissolving","Why does salt dissolve in water?","Polar water molecules stabilize separated sodium and chloride ions.","What determines solubility?","Lattice energy, solvation and entropy all contribute."],["📐","Mathematics","Prime numbers","Why are primes special?","Every integer greater than one has a unique prime factorization, apart from ordering.","Where do primes matter?","Large integer factorization underpins some cryptographic systems."],["🗣️","Linguistics","Language change","Why do languages change?","Sound shifts, contact, analogy and social variation reshape languages over time.","What is grammaticalization?","Words and constructions can develop new grammatical functions."],["🏺","History","Historical evidence","Why do historians disagree?","Sources can be incomplete, biased or contradictory.","How is evidence evaluated?","Historians compare provenance, context and independent accounts."],["🧠","Science","Scientific method","What makes a hypothesis testable?","It implies observable outcomes that could count against it.","Why replicate?","Independent repetition tests whether findings are robust."],["🧙","Lord of the Rings","The One Ring","Why is the Ring dangerous?","Sauron invested much of his power in the One Ring, which tempts its bearers toward domination.","Why does Gandalf refuse it?","He fears even good intentions would be corrupted into tyranny."],["🎲","Dungeons & Dragons","Dice probability","Why is the d20 central?","In many editions, a twenty-sided die determines outcomes of attacks, checks and saves.","How do modifiers work?","They shift the range of totals and the chance of meeting a target."],["🦈","Sharks","Teeth","Why do sharks replace teeth?","Many sharks grow replacement teeth throughout life as older ones wear out or are lost.","Are all shark teeth alike?","No. Their shapes vary with diets and feeding strategies."],["🗡️","Zelda Lore","The hero","Why are there different Links?","Many Zelda titles feature different heroes living in distinct eras.","Why do timelines matter?","They connect recurring legends and kingdoms across adventures."],["🐉","Elder Scrolls Lore","Tamrielic beliefs","What separates Aedra and Daedra?","Many Tamrielic traditions distinguish them by their roles in creation.","Is the distinction universal?","No. In-world religious accounts can conflict."],["🌳","Shannara Lore","The Four Lands","What world is Shannara set in?","Its stories unfold in a distant future after the collapse of an earlier technological civilization.","What were the Great Wars?","Catastrophic conflicts that transformed the world and its civilizations."],["🌿","Mapuche Culture, Language & History","Mapudungun","What is Mapudungun?","It is the language associated with the Mapuche people in areas of present-day Chile and Argentina.","What is Wallmapu?","A term for Mapuche territory or homeland, with meanings shaped by historical and contemporary usage."],["🔤","Agglutinating Languages","Word building","What is agglutination?","A morphological tendency to build words from relatively segmentable morphemes.","Is Mapudungun agglutinative?","It has extensive suffixing, particularly in verbs, and is commonly described as agglutinative."],["🪐","General Relativity","Time and gravity","Why does gravity affect time?","Clocks in different gravitational conditions can accumulate different amounts of proper time.","Where does this matter?","GPS calculations account for relativistic effects on satellite clocks."],["⏳","Physics of Time Travel","Time dilation","Can relativity carry you into the future?","A fast-moving traveler can experience less elapsed time than someone who stays behind.","Can it take you to the past?","Some mathematical solutions permit closed timelike curves, but no practical method is demonstrated."],["🚂","Trains & Railways","Rail engineering","Why do steel wheels run on steel rails?","Steel-on-steel rolling contact offers low resistance while supporting heavy loads.","What limits speed?","Track geometry, braking, traction, aerodynamics and signaling all matter."]];let page='library',id=0,depth=0,round=0,answered=null,query='';let saved=[];try{saved=JSON.parse(localStorage.getItem('wb4-preview-saved')||'[]')}catch(e){}const app=document.getElementById('app'),nav=document.getElementById('nav');function esc(x){return String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&gt;'}[c]))}function openTopic(i){id=i;depth=0;page='lesson';render()}function render(){nav.innerHTML=[['library','📚 Subjects'],['saved','🔖 Saved'],['games','🎮 Games']].map(([k,v])=>'<button class="'+(page===k?'active':'')+'" data-page="'+k+'">'+v+'</button>').join('');if(page==='library'||page==='saved'){const filtered=topics.map((t,i)=>({t,i})).filter(({t,i})=>(page==='library'||saved.includes(i))&&(t.join(' ').toLowerCase().includes(query.toLowerCase())));app.innerHTML='<div class="panel"><h2>'+(page==='library'?'Subject library':'Saved subjects')+'</h2><p class="muted">Choose a subject, then follow its focused discovery path. This is an early interactive preview, not the full 50-fact expansion.</p><input id="search" placeholder="Search subjects" value="'+esc(query)+'"><p class="muted">'+filtered.length+' subjects</p></div><div class="grid">'+filtered.map(({t,i})=>'<button class="tile" data-topic="'+i+'"><span class="emoji">'+t[0]+'</span><strong>'+esc(t[1])+'</strong><small>'+esc(t[2])+'</small></button>').join('')+'</div>'}else if(page==='lesson'){let t=topics[id],q=depth===0?t[3]:depth===1?t[5]:'What does this tell us?',a=depth===0?t[4]:depth===1?t[6]:'This preview branch ends here. The full lesson will expand with additional mechanisms, evidence, and examples.';app.innerHTML='<div class="crumb">Subjects / '+esc(t[1])+' / '+esc(t[2])+' / Depth '+(depth+1)+'</div><div class="panel"><div class="depth">'+['🌱 Big idea','🔎 Closer look','🔬 Next questions'][depth]+'</div><h2>'+esc(q)+'</h2><p class="answer">'+esc(a)+'</p><div class="bar"><span style="width:'+((depth+1)/3*100)+'%"></span></div><div class="actions">'+(depth?'<button data-back>← Previous</button>':'<button data-page="library">← Subjects</button>')+(depth<2?'<button class="primary" data-deeper>Go deeper →</button>':'')+'<button data-save>'+ (saved.includes(id)?'★ Saved':'☆ Save')+'</button></div></div><div class="panel"><h3>Your exploration path</h3><p>1. '+esc(t[3])+'</p><p>2. '+esc(t[5])+'</p><p>3. Further questions and evidence (coming in full version)</p></div>'}else{let t=topics[(round*7+2)%topics.length],truth=round%2===0,statement=truth?t[4]:'Every scientific explanation is permanently final and can never be revised.';app.innerHTML='<div class="panel"><h2>🎮 Fact or Fiction</h2><p>No timer, no streaks. Learn from each answer.</p><p class="muted">'+esc(t[1])+' · Round '+(round+1)+'</p><h3>'+esc(t[3])+'</h3><p class="answer">'+esc(statement)+'</p><button class="gamebtn '+(answered===null?'':truth?'correct':'wrong')+'" data-answer="true">True</button><button class="gamebtn '+(answered===null?'':truth?'wrong':'correct')+'" data-answer="false">False</button>'+(answered===null?'':'<div class="notice">'+(answered===truth?'Correct!':'Not quite.')+' '+esc(t[4])+'</div><div class="actions"><button class="primary" data-next>Next question →</button><button data-topic="'+((round*7+2)%topics.length)+'">Explore subject</button></div>')+'</div>'}}document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let d=b.dataset;if(d.page){page=d.page;query='';render()}else if(d.topic!==undefined)openTopic(+d.topic);else if(d.deeper!==undefined){depth=Math.min(depth+1,2);render()}else if(d.back!==undefined){depth=Math.max(depth-1,0);render()}else if(d.save!==undefined){saved=saved.includes(id)?saved.filter(x=>x!==id):[...saved,id];try{localStorage.setItem('wb4-preview-saved',JSON.stringify(saved))}catch(e){}render()}else if(d.answer!==undefined&&answered===null){answered=d.answer==='true';render()}else if(d.next!==undefined){round++;answered=null;render()}});document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;let p=e.target.selectionStart;render();let s=document.getElementById('search');s.focus();s.setSelectionRange(p,p)}});render();</script></body></html>
